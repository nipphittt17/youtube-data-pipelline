
version: 2

sources:

  - name: snapshot
    database: TADA_YOUTUBE_DATA
    schema: STAGING

    tables:

      # Raw product data
      - name: stg_channel_daily_snapshot
        identifier: stg_channel_daily_snapshot

      - name: stg_video_daily_snapshot
        identifier: stg_video_daily_snapshot

models:
  - name: dim_channel_latest
    description: "Transform channel snapshot data"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - recorded_at
                - username
    columns:
      - name: recorded_at
        data_tests:
          - not_null

      - name: username
        data_tests:
          - not_null

  - name: dim_video_latest
    description: "Transform video snapshot data"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
                - recorded_at
                - vdo_id
    columns:
      - name: recorded_at
        data_tests:
          - not_null

      - name: vdo_id
        data_tests:
          - unique
          - not_null
