        data_tests:
          - not_null

      - name: region
        data_tests:
          - not_null

      - name: master_product_id
        data_tests:
          - not_null

      - name: order_year_month
        data_tests:
          - not_null


  - name: vw_monthly_sales
    description: "Overall monthly sales performance"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
