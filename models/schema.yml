version: 2

sources:

  # ==========================================
  # Raw data
  # ==========================================

  - name: raw_data
    database: DBT_CLOUD
    schema: RAW_DATA

    tables:

      # Raw product data
      - name: product_shopee
        identifier: raw_product_shopee

      - name: product_lazada
        identifier: raw_product_lazada

      - name: product_tiktok
        identifier: raw_product_tiktok

      # Raw order item data
      - name: order_shopee
        identifier: raw_order_shopee

      - name: order_lazada
        identifier: raw_order_lazada

      - name: order_tiktok
        identifier: raw_order_tiktok


  # ==========================================
  # Reference data
  # ==========================================

  - name: blue_reference
    database: DBT_CLOUD
    schema: BLUE_REFERENCE

    tables:

      # Product Catalog Reference
      - name: master_product_catalog
        identifier: master_product_catalog

      # Product Mapping Reference
      - name: master_product_mapping
        identifier: master_product_mapping


models:

  # ==========================================
  # Product staging
  # ==========================================

  - name: stg_product_shopee
    description: "A Shopee product staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  - name: stg_product_lazada
    description: "A Lazada product staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  - name: stg_product_tiktok
    description: "A TikTok product staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  # ==========================================
  # Order item staging
  # ==========================================

  - name: stg_order_shopee
    description: "A Shopee order item staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - order_id
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  - name: stg_order_lazada
    description: "A Lazada order item staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - order_id
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  - name: stg_order_tiktok
    description: "A TikTok order item staging model"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - order_id
              - product_id
              - sku_id

    columns:
      - name: region
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  # ==========================================
  # Mart tables
  # ==========================================

  - name: dim_product
    description: "A product dimension combining all 3 platform product data"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
              - region
              - product_id
              - sku_id

    columns:
      - name: platform
        data_tests:
          - not_null

      - name: region
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  - name: fact_order
    description: "An order fact table combining all 3 platform order data"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
              - region
              - order_id
              - product_id
              - sku_id

    columns:
      - name: platform
        data_tests:
          - not_null

      - name: region
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: sku_id
        data_tests:
          - not_null


  # ==========================================
  # Mart views
  # ==========================================

  - name: vw_product_monthly_sales
    description: "Product-level sales analysis"

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
